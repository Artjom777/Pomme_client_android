name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.code.outputs.code == 'true' }}
      launcher: ${{ github.event_name != 'pull_request' || steps.launcher.outputs.launcher == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: code
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE*'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: launcher
        with:
          filters: |
            launcher:
              - 'pomme-launcher/**'
              - 'pomme-auth/**'
              - 'pomme-dirs/**'
              - 'pomme-install/**'
              - 'pomme-protocol/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
  android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: android
      - name: Add the Android target
        run: rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk@4.1.2 --locked
      - name: Clippy
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a clippy -p pomme-android -- -D warnings
      - name: Build Android Release
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a build -p pomme-android --release
          mkdir -p artifacts
          cp target/aarch64-linux-android/release/libpomme_android.so artifacts/ || cp target/aarch64-linux-android/release/*.so artifacts/ || true
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomme-android-arm64
          path: artifacts/*
  ios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ios
      - name: Add the iOS target
        run: rustup target add aarch64-apple-ios
      - uses: actions/cache@v4
        with:
          path: target/moltenvk
          key: moltenvk-${{ hashFiles('tools/fetch_moltenvk.py') }}
      - name: Clippy
        run: SHADERC_LIB_DIR="$VULKAN_SDK/lib" VULKAN_SDK="$(python3 tools/fetch_moltenvk.py ios)" cargo clippy -p pomme-ios --target aarch64-apple-ios -- -D warnings
      - name: Build iOS Release
        run: |
          SHADERC_LIB_DIR="$VULKAN_SDK/lib" VULKAN_SDK="$(python3 tools/fetch_moltenvk.py ios)" cargo build -p pomme-ios --target aarch64-apple-ios --release
          mkdir -p artifacts
          cp target/aarch64-apple-ios/release/*.a artifacts/ || cp target/aarch64-apple-ios/release/*.dylib artifacts/ || true
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomme-ios-arm64
          path: artifacts/*
  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just ci-fmt
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
      - run: just ci-lint
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - run: just ci-test
  singleplayer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: singleplayer
      - name: Pin the steel revision
        id: steel
        run: echo "rev=$(git -C third_party/SteelMC rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache the generated steel source
        uses: actions/cache@v6
        with:
          path: |
            third_party/SteelMC/steel-core/src/behavior/generated
            third_party/SteelMC/steel-core/src/entity/generated
            third_party/SteelMC/steel-registry/src/generated
            third_party/SteelMC/steel-utils/src/generated
            third_party/SteelMC/steel-utils/build_assets
            third_party/SteelMC/steel-worldgen/src/generated
          key: steel-generated-${{ steps.steel.outputs.rev }}
      - run: just ci-singleplayer
      - name: Build SteelMC Release
        run: |
          cargo build --release -p steel-core || cargo build --release || true
          mkdir -p artifacts
          find target/release -maxdepth 1 -type f -executable -exec cp {} artifacts/steel-singleplayer-linux \; || true
      - name: Upload SteelMC Artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-singleplayer-linux
          path: artifacts/*
  pr-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check PR template and labeler agree
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          def read(path):
              return pathlib.Path(path).read_text(encoding="utf-8").replace("\r\n", "\n")
          template = read(".github/PULL_REQUEST_TEMPLATE.md")
          workflow = read(".github/workflows/pr-tags.yml")
          section = re.search(r"## Type of change\n(.*?)(?=\n## |\Z)", template, re.S)
          if section is None:
              sys.exit("::error::PULL_REQUEST_TEMPLATE.md has no '## Type of change' section")
          boxes = set(re.findall(r"^- \[ \] (.+)$", section.group(1), re.M))
          mapped = set(re.findall(r'text:\s*"([^"]+)"', workflow))
          drift = [f"checkbox {t!r} has no label in pr-tags.yml" for t in sorted(boxes - mapped)]
          drift += [f"pr-tags.yml maps {t!r}, which is not a checkbox" for t in sorted(mapped - boxes)]
          for problem in drift:
              print(f"::error::{problem}")
          if drift:
              sys.exit(1)
          print(f"{len(boxes)} checkboxes match their label mappings")
          PY
  launcher-frontend:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Format check
        run: pnpm --filter pomme-launcher format:check
      - name: Lint
        run: pnpm --filter pomme-launcher lint
      - name: Type check
        run: pnpm --filter pomme-launcher exec tsc --noEmit
  launcher:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: launcher
          cache-on-failure: true
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt -p pomme-launcher -- --check
      - name: Clippy
        run: cargo clippy -p pomme-launcher --release --all-targets --all-features -- -D warnings
      - name: Check bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -p pomme-launcher --quiet --bin generate-bindings
          if ! git diff --exit-code -- ./pomme-launcher/src/bindings; then
            echo "::error::pomme-launcher/src/bindings is stale. Run 'cargo run -p pomme-launcher --bin generate-bindings' and commit."
            exit 1
          fi
      - name: Build Launcher Release Binary
        run: cargo build -p pomme-launcher --release
      - name: Prepare build artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          cp target/release/pomme-launcher artifacts/pomme-launcher-${{ matrix.os }}
      - name: Prepare build artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/release/pomme-launcher.exe artifacts/pomme-launcher-windows.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: artifacts/*
  ci:
    if: always()
    needs:
      - changes
      - android
      - ios
      - fmt
      - lint
      - test
      - singleplayer
      - pr-template
      - launcher-frontend
      - launcher
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
  release:
    needs: [ci, launcher, android, ios, singleplayer]
    if: github.event_name != 'pull_request' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          prerelease: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
