name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android Targets
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk@4.1.2 --locked

      - name: Build Standard ARM64 APK (arm64-v8a)
        run: |
          mkdir -p pomme-android/app/src/main/jniLibs/arm64-v8a
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a build -p pomme-android --release
          cp target/aarch64-linux-android/release/libpomme_android.so pomme-android/app/src/main/jniLibs/arm64-v8a/
          cd pomme-android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mkdir -p artifacts
          cp $(find pomme-android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1) artifacts/pomme-client-arm64-v8a.apk

      - name: Build Optimized APK for POCO X7 Pro (ARMv9.2-A / Cortex-A725)
        continue-on-error: true
        run: |
          rm -rf pomme-android/app/src/main/jniLibs/*
          mkdir -p pomme-android/app/src/main/jniLibs/arm64-v8a
          if RUSTFLAGS="-C target-cpu=neoverse-v2 -C opt-level=3 -C lto=fat -C codegen-units=1 -C target-feature=+sve,+sve2,+neon,+fp16" \
             ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a build -p pomme-android --release --target-dir target_v92a; then
            cp target_v92a/aarch64-linux-android/release/libpomme_android.so pomme-android/app/src/main/jniLibs/arm64-v8a/
            cd pomme-android
            ./gradlew clean assembleDebug
            cd ..
            cp $(find pomme-android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1) artifacts/pomme-client-pocox7pro-armv9.2a.apk
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: artifacts/*.apk

  release:
    if: github.event_name != 'pull_request'
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Release Tag
        id: vars
        run: |
          echo "tag=nightly-$(date +'%Y%m%d%H%M')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Nightly Build (${{ steps.vars.outputs.date }})"
          prerelease: false
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
